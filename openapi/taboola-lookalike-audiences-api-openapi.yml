openapi: 3.1.0
info:
  title: Taboola Backstage Accounts Lookalike Audiences API
  version: '1.0'
  description: 'Access and search advertiser accounts within a Taboola network. Used by ad ops platforms and

    agencies managing multiple advertiser accounts under a Taboola network account.'
  contact:
    name: Taboola Developer Relations
    url: https://developers.taboola.com/backstage-api/reference
servers:
- url: https://backstage.taboola.com/backstage/api/1.0
security:
- bearerAuth: []
tags:
- name: Lookalike Audiences
paths:
  /{account_id}/dictionary/lookalike_audiences:
    get:
      tags:
      - Lookalike Audiences
      summary: Get Lookalike Audiences
      description: Get a list of available lookalike audiences for the account.
      operationId: getLookalikeAudiences
      parameters:
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Lookalike audiences.
components:
  parameters:
    accountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
