description: |-
  Binds each Realize MCP tool to the Backstage API operation(s) that back it. The live
  MCP tools/list is OAuth-gated (401 + RFC 9728 challenge), so tools are mapped by name
  and by the parameter lists the provider documents in the realize-mcp README, not by
  live introspection. Where a tool has a clean 1:1 REST equivalent the confidence is
  high; where the MCP name implies a composite or a surface the public Backstage
  reference does not expose, it is marked mcp_only or given a lower confidence.

surfaces:
  openapi:
    path: openapi/
    files: 16
    operations: 60
    server: https://backstage.taboola.com/backstage/api/1.0
    gated: false
  mcp:
    url: https://mcp.realize.com/mcp
    transport: streamable-http
    gated: true
    gate: OAuth 2.1 bearer; tools/list returns 401 with WWW-Authenticate resource_metadata
  graphql:
    present: false

