mcp_only:
  - tool: list_time_zones
    reason: >-
      Static enum served by the MCP for activity_schedule.time_zone. No public Backstage
      dictionary endpoint for IANA time zones is documented.
  - tool: list_cta_types
    reason: >-
      Static enum for cta.cta_type. Backstage exposes item enums via getItemEnums but the
      docs do not name a CTA-specific resource.
  - tool: get_campaign_history_report
    reason: >-
      Change/audit log (change_type, old_value -> new_value, performer). Announced in the
      Backstage changelog as "Campaign History Report" but not present as a documented
      operation in the captured OpenAPI.

rest_only:
  - operations: [deleteCampaign, duplicateCampaign]
    reason: The MCP exposes no delete or duplicate tool; the plugin routes these to the Realize UI.
  - operations: [deleteCampaignItem]
    reason: No item-delete tool in the MCP surface.
  - operations: [bulkUpdateCampaigns, getAllCampaignsAcrossNetwork, massCreateItems, bulkCreateItemsAcrossCampaigns, bulkUpdateItemsAcrossCampaigns, bulkDeleteItemsAcrossCampaigns]
    reason: Bulk and network-wide operations are REST-only; the plugin documents them as a UI/API fallback.
  - operations: [getMyAudienceTargeting, updateMyAudienceTargeting]
    reason: Campaign-level audience targeting writes are not exposed as MCP tools.
  - operations: [getAllCombinedAudiences, getCombinedAudience, createCombinedAudience, updateCombinedAudience]
    reason: Combined audiences have no MCP tool.
  - operations: [createConversionRule, updateConversionRule, archiveConversionRule, getConversionRule]
    reason: Conversion-rule writes are REST-only; the MCP reads them via search_conversion_rules.
  - operations: [createFirstPartyAudience, addRemoveAudienceUsers, getMyAudience]
    reason: First-party audience onboarding (PII upload) is deliberately not agent-exposed.
  - operations: [getAllVideoItems, createVideoItem]
    reason: Performance video (motion ad) items have no MCP tool.
  - operations: [getListOfPlatforms, getListOfLanguages, getCampaignEnums, getItemEnums, getMinimumCpcValues]
    reason: Dictionary lookups with no matching discovery tool.
  - operations: [getRealTimeAdsReport]
