  documents are served: an RFC 9727 API catalog (application/linkset+json) on the
  developer portal, and the RFC 9728 / RFC 8414 OAuth metadata pair on the MCP host.
  Everything else is a miss — developers.taboola.com is a ReadMe SPA that answers 200
  with a ~534 KB HTML shell for any unmatched /.well-known/* path, and
  backstage.taboola.com answers 200 with its sign-in page, so both are recorded as
  soft-200 misses rather than hits.

