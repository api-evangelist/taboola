description: |-
  First-party Taboola client libraries. Two distinct families: the Backstage API Java
  client (the only registry-published SDK for the advertising REST API) and the mobile
  Taboola SDK family (iOS/Android/Flutter, for publishers embedding recommendation
  widgets — a different product surface from the Backstage API). The Realize MCP server
  is also pip-installable for self-hosting.

  Currency finding: the Backstage API Java client last published 1.1.12 on 2025-05-02,
  while the API it wraps has shipped changelog entries since. The Maven Android SDK
  coordinate (com.taboola:android-sdk) last published 2.0.3 in 2021 and is superseded —
  current Android distribution moved off Maven Central.

